<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1C1C1C"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Lingua"/>
  <meta name="description" content="AI-powered language learning"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Lingua</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    body { background: #F5F2ED; font-family: 'DM Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button:active { opacity: 0.75; }
    ::-webkit-scrollbar { width: 4px; } 
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const LANGUAGES = [
  { code: "es", name: "Spanish", flag: "🇪🇸", native: "Español" },
  { code: "fr", name: "French", flag: "🇫🇷", native: "Français" },
  { code: "de", name: "German", flag: "🇩🇪", native: "Deutsch" },
  { code: "it", name: "Italian", flag: "🇮🇹", native: "Italiano" },
  { code: "pt", name: "Portuguese", flag: "🇵🇹", native: "Português" },
  { code: "ja", name: "Japanese", flag: "🇯🇵", native: "日本語" },
  { code: "zh", name: "Chinese", flag: "🇨🇳", native: "中文" },
  { code: "ar", name: "Arabic", flag: "🇸🇦", native: "العربية" },
];

const NATIVE_LANGUAGES = [
  { code: "en", name: "English", flag: "🇬🇧", native: "English" },
  { code: "es", name: "Spanish", flag: "🇪🇸", native: "Español" },
  { code: "fr", name: "French", flag: "🇫🇷", native: "Français" },
  { code: "de", name: "German", flag: "🇩🇪", native: "Deutsch" },
  { code: "it", name: "Italian", flag: "🇮🇹", native: "Italiano" },
  { code: "pt", name: "Portuguese", flag: "🇵🇹", native: "Português" },
  { code: "el", name: "Greek", flag: "🇬🇷", native: "Ελληνικά" },
  { code: "ru", name: "Russian", flag: "🇷🇺", native: "Русский" },
  { code: "ja", name: "Japanese", flag: "🇯🇵", native: "日本語" },
  { code: "zh", name: "Chinese", flag: "🇨🇳", native: "中文" },
  { code: "ar", name: "Arabic", flag: "🇸🇦", native: "العربية" },
  { code: "hi", name: "Hindi", flag: "🇮🇳", native: "हिन्दी" },
  { code: "tr", name: "Turkish", flag: "🇹🇷", native: "Türkçe" },
  { code: "ko", name: "Korean", flag: "🇰🇷", native: "한국어" },
  { code: "nl", name: "Dutch", flag: "🇳🇱", native: "Nederlands" },
  { code: "pl", name: "Polish", flag: "🇵🇱", native: "Polski" },
];

const LEVELS = ["Beginner", "Intermediate", "Advanced"];
const TOPICS = [
  "Greetings & Introductions", "Numbers & Time", "Food & Dining",
  "Travel & Directions", "Shopping", "Family & Relationships",
];

const callClaude = async (apiKey, messages, systemPrompt, max_tokens = 2000) => {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal: controller.signal,
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-calls": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens,
        system: systemPrompt,
        messages,
      }),
    });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error?.message || `API error ${response.status}`);
    if (!data.content?.[0]?.text) throw new Error("Empty response from API");
    return data.content[0].text;
  } finally {
    clearTimeout(timeout);
  }
};

// ── API KEY SCREEN ─────────────────────────────────────────────────────────

function ApiKeyScreen({ onSave }) {
  const [key, setKey] = useState("");
  const [show, setShow] = useState(false);
  return (
    <div style={S.screen}>
      <header style={S.header}>
        <div style={S.logo}>
          <span style={S.logoMark}>L</span>
          <span style={S.logoText}>Lingua</span>
        </div>
        <p style={S.tagline}>Learn any language, intelligently.</p>
      </header>
      <div style={S.tipBox}>
        <span style={S.tipLabel}>🔑 Setup required</span>
        <p style={{...S.tipText, marginTop: 6}}>
          Lingua uses the Claude AI API to generate lessons. Enter your Anthropic API key to get started.
          Your key is stored only on this device.
        </p>
        <p style={{...S.tipText, marginTop: 8}}>
          Get a free key at <strong>console.anthropic.com</strong>
        </p>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <label style={S.label}>Your API Key</label>
        <div style={{ position: "relative" }}>
          <input
            type={show ? "text" : "password"}
            value={key}
            onChange={e => setKey(e.target.value)}
            placeholder="sk-ant-..."
            style={S.input}
          />
          <button onClick={() => setShow(s => !s)} style={S.eyeBtn}>{show ? "🙈" : "👁️"}</button>
        </div>
      </div>
      <button
        style={{ ...S.ctaBtn, ...(key.startsWith("sk-") ? {} : S.ctaBtnDisabled) }}
        disabled={!key.startsWith("sk-")}
        onClick={() => { localStorage.setItem("lingua_api_key", key); onSave(key); }}
      >
        Start Learning →
      </button>
    </div>
  );
}

// ── HOME SCREEN ─────────────────────────────────────────────────────────────

function HomeScreen({ onStart, onResetKey }) {
  const [lang, setLang] = useState(null);
  const [nativeLang, setNativeLang] = useState(null);
  const [nativeOpen, setNativeOpen] = useState(false);
  const [level, setLevel] = useState("Beginner");
  const [topic, setTopic] = useState(TOPICS[0]);
  const canStart = lang && nativeLang && lang.code !== nativeLang.code;

  return (
    <div style={S.screen}>
      <header style={S.header}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={S.logo}>
            <span style={S.logoMark}>L</span>
            <span style={S.logoText}>Lingua</span>
          </div>
          <button onClick={onResetKey} style={S.resetBtn}>🔑 API Key</button>
        </div>
        <p style={S.tagline}>Learn any language, intelligently.</p>
      </header>

      <section style={S.section}>
        <label style={S.label}>Your native language</label>
        <div style={{ position: "relative" }}>
          <button style={S.nativeSelect} onClick={() => setNativeOpen(o => !o)}>
            {nativeLang ? (
              <span style={S.nativeSelected}>
                <span style={{ fontSize: 18 }}>{nativeLang.flag}</span>
                <span style={{ fontSize: 14, color: "#1C1C1C" }}>{nativeLang.name}</span>
                <span style={{ fontSize: 12, color: "#999" }}>{nativeLang.native}</span>
              </span>
            ) : (
              <span style={{ fontSize: 14, color: "#bbb" }}>Select your native language…</span>
            )}
            <span style={{ marginLeft: "auto", opacity: 0.35, fontSize: 11 }}>{nativeOpen ? "▲" : "▼"}</span>
          </button>
          {nativeOpen && (
            <div style={S.nativeDropdown}>
              {NATIVE_LANGUAGES.map(nl => (
                <button key={nl.code}
                  style={{ ...S.nativeOption, ...(nativeLang?.code === nl.code ? S.nativeOptionActive : {}) }}
                  onClick={() => { setNativeLang(nl); setNativeOpen(false); }}>
                  <span style={{ fontSize: 16 }}>{nl.flag}</span>
                  <span style={{ fontSize: 13, color: "#1C1C1C" }}>{nl.name}</span>
                  <span style={{ fontSize: 11, color: "#aaa", marginLeft: "auto" }}>{nl.native}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </section>

      <section style={S.section}>
        <label style={S.label}>Language to learn</label>
        <div style={S.langGrid}>
          {LANGUAGES.filter(l => l.code !== nativeLang?.code).map(l => (
            <button key={l.code}
              style={{ ...S.langCard, ...(lang?.code === l.code ? S.langCardActive : {}) }}
              onClick={() => setLang(l)}>
              <span style={S.flag}>{l.flag}</span>
              <span style={S.langName}>{l.name}</span>
              <span style={S.nativeName}>{l.native}</span>
            </button>
          ))}
        </div>
      </section>

      <section style={S.section}>
        <label style={S.label}>Your level</label>
        <div style={S.pillRow}>
          {LEVELS.map(l => (
            <button key={l} style={{ ...S.pill, ...(level === l ? S.pillActive : {}) }} onClick={() => setLevel(l)}>{l}</button>
          ))}
        </div>
      </section>

      <section style={S.section}>
        <label style={S.label}>Topic</label>
        <div style={S.pillRow}>
          {TOPICS.map(t => (
            <button key={t} style={{ ...S.pill, ...(topic === t ? S.pillActive : {}) }} onClick={() => setTopic(t)}>{t}</button>
          ))}
        </div>
      </section>

      <button style={{ ...S.ctaBtn, ...(canStart ? {} : S.ctaBtnDisabled) }} disabled={!canStart}
        onClick={() => onStart({ lang, nativeLang, level, topic })}>
        Start Lesson →
      </button>
    </div>
  );
}

// ── LESSON SCREEN ───────────────────────────────────────────────────────────

function LessonScreen({ config, apiKey, onQuiz, onBack }) {
  const [lesson, setLesson] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [words, setWords] = useState([]);
  const [flipped, setFlipped] = useState({});

  const loadLesson = async () => {
    setLoading(true); setError(null);
    try {
      const sys = `You are a professional language teacher. Respond ONLY with valid JSON, no markdown, no extra text.`;
      const prompt = `Create a ${config.level} ${config.lang.name} lesson about "${config.topic}" for a ${config.nativeLang.name} speaker.
Return ONLY this JSON object (no other text):
{"title":"lesson title in ${config.nativeLang.name}","intro":"2-sentence intro in ${config.nativeLang.name}","vocabulary":[{"word":"word in ${config.lang.name}","translation":"translation in ${config.nativeLang.name}","example":"example in ${config.lang.name}","example_translation":"translation in ${config.nativeLang.name}"}],"tip":"grammar/culture tip in ${config.nativeLang.name}"}
Include exactly 6 vocabulary items.`;
      const raw = await callClaude(apiKey, [{ role: "user", content: prompt }], sys, 2000);
      const data = JSON.parse(raw.replace(/```json|```/g, "").trim());
      setLesson(data); setWords(data.vocabulary);
    } catch (e) {
      setError(e.message || "Couldn't load the lesson.");
    } finally { setLoading(false); }
  };

  useEffect(() => { loadLesson(); }, []);
  const toggleFlip = i => setFlipped(p => ({ ...p, [i]: !p[i] }));

  if (loading) return (
    <div style={S.center}>
      <div style={S.spinner}/>
      <p style={S.loadingText}>Preparing your lesson…</p>
    </div>
  );

  if (error) return (
    <div style={S.center}>
      <span style={{ fontSize: 40 }}>⚠️</span>
      <p style={{ fontSize: 14, color: "#555", textAlign: "center", maxWidth: 280, lineHeight: 1.5 }}>{error}</p>
      <button style={S.ctaBtn} onClick={loadLesson}>Try Again</button>
      <button style={{ ...S.ctaBtn, background: "transparent", color: "#999", border: "1.5px solid #E8E4DF" }} onClick={onBack}>← Go Back</button>
    </div>
  );

  return (
    <div style={S.screen}>
      <div style={S.breadcrumb}>{config.nativeLang.flag} {config.nativeLang.name} → {config.lang.flag} {config.lang.name} · {config.level}</div>
      <h1 style={S.lessonTitle}>{lesson.title}</h1>
      <p style={S.intro}>{lesson.intro}</p>
      <h2 style={S.sectionHead}>Vocabulary</h2>
      <p style={S.hint}>Tap a card to reveal the translation</p>
      <div style={S.cardGrid}>
        {words.map((w, i) => (
          <div key={i} style={{ ...S.flashCard, ...(flipped[i] ? S.flashCardFlipped : {}) }} onClick={() => toggleFlip(i)}>
            {!flipped[i] ? (
              <><span style={S.cardWord}>{w.word}</span><span style={S.cardTap}>tap to reveal</span></>
            ) : (
              <><span style={S.cardTranslation}>{w.translation}</span><span style={S.cardExample}>{w.example}</span><span style={S.cardExampleTrans}>{w.example_translation}</span></>
            )}
          </div>
        ))}
      </div>
      <div style={S.tipBox}>
        <span style={S.tipLabel}>💡 Tip</span>
        <p style={S.tipText}>{lesson.tip}</p>
      </div>
      <button style={S.ctaBtn} onClick={() => onQuiz(words)}>Take the Quiz →</button>
    </div>
  );
}

// ── QUIZ SCREEN ─────────────────────────────────────────────────────────────

function QuizScreen({ config, apiKey, words, onDone }) {
  const [questions, setQuestions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const loadQuiz = async () => {
    setLoading(true); setError(null);
    try {
      const sys = `You are a language quiz generator. Respond ONLY with valid JSON, no markdown, no extra text.`;
      const vocab = JSON.stringify(words.map(w => ({ word: w.word, translation: w.translation })));
      const prompt = `Create 5 multiple choice quiz questions for these ${config.lang.name} words: ${vocab}.
Native language is ${config.nativeLang.name}. Mix question styles.
Return ONLY this JSON array: [{"question":"...","options":["A","B","C","D"],"correct":0}]`;
      const raw = await callClaude(apiKey, [{ role: "user", content: prompt }], sys, 1500);
      setQuestions(JSON.parse(raw.replace(/```json|```/g, "").trim()));
    } catch (e) {
      setError(e.message || "Couldn't load the quiz.");
    } finally { setLoading(false); }
  };

  useEffect(() => { loadQuiz(); }, []);

  const answer = idx => {
    if (selected !== null) return;
    setSelected(idx);
    if (idx === questions[current].correct) setScore(s => s + 1);
  };

  const next = () => {
    if (current + 1 >= questions.length) { setDone(true); }
    else { setCurrent(c => c + 1); setSelected(null); }
  };

  if (loading) return <div style={S.center}><div style={S.spinner}/><p style={S.loadingText}>Generating quiz…</p></div>;

  if (error) return (
    <div style={S.center}>
      <span style={{ fontSize: 40 }}>⚠️</span>
      <p style={{ fontSize: 14, color: "#555", textAlign: "center", maxWidth: 280, lineHeight: 1.5 }}>{error}</p>
      <button style={S.ctaBtn} onClick={loadQuiz}>Try Again</button>
      <button style={{ ...S.ctaBtn, background: "transparent", color: "#999", border: "1.5px solid #E8E4DF" }} onClick={onDone}>← Go Back</button>
    </div>
  );

  if (done) {
    const pct = Math.round(score / questions.length * 100);
    return (
      <div style={{ ...S.screen, alignItems: "center", textAlign: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 8 }}>{pct === 100 ? "🏆" : pct >= 60 ? "🎉" : "📚"}</div>
        <h1 style={S.lessonTitle}>Quiz Complete</h1>
        <p style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 40, fontWeight: 600, color: "#1C1C1C" }}>{score} / {questions.length}</p>
        <div style={{ width: "100%", height: 6, background: "#E8E4DF", borderRadius: 10, overflow: "hidden", margin: "8px 0" }}>
          <div style={{ height: "100%", width: `${pct}%`, background: "#1C1C1C", borderRadius: 10, transition: "width 0.6s ease" }}/>
        </div>
        <p style={{ fontSize: 15, color: "#777", fontWeight: 300, maxWidth: 300, lineHeight: 1.6 }}>
          {pct === 100 ? "Perfect score! You're a natural." : pct >= 60 ? "Great effort! Keep practicing." : "Keep going — consistency is everything."}
        </p>
        <button style={S.ctaBtn} onClick={onDone}>← Back to Home</button>
      </div>
    );
  }

  const q = questions[current];
  return (
    <div style={S.screen}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#999" }}>
        <span>Question {current + 1} of {questions.length}</span>
        <span style={{ fontWeight: 500, color: "#1C1C1C" }}>Score: {score}</span>
      </div>
      <div style={{ height: 3, background: "#E8E4DF", borderRadius: 10, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${(current / questions.length) * 100}%`, background: "#1C1C1C", transition: "width 0.4s ease" }}/>
      </div>
      <h2 style={S.question}>{q.question}</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {q.options.map((opt, i) => {
          let st = S.optionBtn;
          if (selected !== null) {
            if (i === q.correct) st = { ...st, ...S.optionCorrect };
            else if (i === selected) st = { ...st, ...S.optionWrong };
          }
          return (
            <button key={i} style={st} onClick={() => answer(i)}>
              <span style={S.optionLetter}>{["A","B","C","D"][i]}</span>
              {opt}
            </button>
          );
        })}
      </div>
      {selected !== null && (
        <button style={S.ctaBtn} onClick={next}>
          {current + 1 < questions.length ? "Next Question →" : "See Results →"}
        </button>
      )}
    </div>
  );
}

// ── ROOT ────────────────────────────────────────────────────────────────────

function App() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("lingua_api_key") || "");
  const [screen, setScreen] = useState("home");
  const [config, setConfig] = useState(null);
  const [quizWords, setQuizWords] = useState(null);

  if (!apiKey) return <ApiKeyScreen onSave={setApiKey}/>;

  return (
    <div style={S.root}>
      <div style={S.container}>
        {screen === "home" && (
          <HomeScreen
            onStart={cfg => { setConfig(cfg); setScreen("lesson"); }}
            onResetKey={() => { localStorage.removeItem("lingua_api_key"); setApiKey(""); }}
          />
        )}
        {screen === "lesson" && (
          <LessonScreen config={config} apiKey={apiKey}
            onBack={() => setScreen("home")}
            onQuiz={words => { setQuizWords(words); setScreen("quiz"); }}
          />
        )}
        {screen === "quiz" && (
          <QuizScreen config={config} apiKey={apiKey} words={quizWords} onDone={() => setScreen("home")}/>
        )}
      </div>
    </div>
  );
}

// ── STYLES ───────────────────────────────────────────────────────────────────
